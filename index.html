<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kkosun Studio</title>
<meta name="description" content="Kkosun Studio(꼬순 스튜디오) — 귀여운 캐주얼 퍼즐 게임을 만듭니다.">
<style>
  :root { --bg: #fff8ec; --card: #ffffff; --ink: #4a2e1c; --sub: #8a6a50; --accent: #d9822b; --line: #f0dcc0; }
  @media (prefers-color-scheme: dark) { :root { --bg: #1f1812; --card: #2a2119; --ink: #f6e7d3; --sub: #c9ae92; --accent: #f3b25a; --line: #3d3025; } }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", "Segoe UI", sans-serif; line-height: 1.6; }
  main { max-width: 720px; margin: 0 auto; padding: 48px 16px 64px; }
  h1 { font-size: 2rem; margin: 0 0 4px; }
  .lead { color: var(--sub); margin: 0 0 32px; }
  .game { display: flex; gap: 20px; align-items: center; background: var(--card); border: 1px solid var(--line); border-radius: 20px; padding: 20px; }
  .game img { width: 96px; height: 96px; border-radius: 22px; flex: none; }
  .game h2 { margin: 0 0 4px; font-size: 1.3rem; }
  .game p { margin: 0 0 8px; color: var(--sub); }
  a { color: var(--accent); }
  footer { margin-top: 40px; font-size: .9rem; color: var(--sub); }
</style>
</head>
<body>
<main>
  <h1>Kkosun Studio</h1>
  <p class="lead">꼬순 스튜디오 · 귀여운 캐주얼 퍼즐 게임을 만듭니다.</p>

  <section class="game">
    <img src="img/puppy-merge.webp" alt="Puppy Merge 아이콘">
    <div>
      <h2>Puppy Merge</h2>
      <p>비숑과 함께하는 숫자 이어 합치기 퍼즐. 같은 숫자를 이어서 더 큰 숫자를 만들어요.</p>
      <a href="privacy/">개인정보 처리방침 · Privacy Policy</a>
    </div>
  </section>

  <footer>
    문의 · Contact: <a href="mailto:kkosunstudio@gmail.com">kkosunstudio@gmail.com</a>
  </footer>
</main>
</body>
</html>
